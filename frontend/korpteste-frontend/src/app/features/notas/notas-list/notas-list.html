<div class="list-container">
  <div class="list-header">
    <h1>Notas Fiscais</h1>
    <a routerLink="/notas/novo" class="btn-primary">Nova Nota</a>
  </div>

  <div *ngIf="erro" class="alert-error">{{ erro }}</div>

  <table class="table">
    <thead>
      <tr>
        <th>Número</th>
        <th>Status</th>
        <th>Qtd. Itens</th>
        <th>Ação</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let nota of notas">
        <td>{{ nota.numero }}</td>
        <td>
          <span class="status-badge" [class.status-fechada]="nota.status === 'Fechada'">
            {{ nota.status }}
          </span>
        </td>
        <td>{{ nota.itens?.length }}</td>
        <td class="acoes">
          <button class="btn-detalhes" (click)="verDetalhes(nota)">Ver Detalhes</button>
          <button
            *ngIf="nota.status === 'Aberta'"
            class="btn-print"
            [disabled]="imprimindo === nota.numero"
            (click)="imprimir(nota.numero)">
            {{ imprimindo === nota.numero ? 'Imprimindo...' : 'Imprimir' }}
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="modal-overlay" *ngIf="notaSelecionada" (click)="fecharDetalhes()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Nota Fiscal #{{ notaSelecionada.numero }}</h2>
      <button class="btn-fechar" (click)="fecharDetalhes()">✕</button>
    </div>

    <p class="modal-status">
      Status:
      <span class="status-badge" [class.status-fechada]="notaSelecionada.status === 'Fechada'">
        {{ notaSelecionada.status }}
      </span>
    </p>

    <table class="table modal-table">
      <thead>
        <tr>
          <th>Código do Produto</th>
          <th>Quantidade</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of notaSelecionada.itens">
          <td>{{ item.produtoCodigo }}</td>
          <td>{{ item.quantidade }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
