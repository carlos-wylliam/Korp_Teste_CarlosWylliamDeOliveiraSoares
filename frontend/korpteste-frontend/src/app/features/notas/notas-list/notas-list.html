<div *ngIf="erro" style="color: red;">{{ erro }}</div>

<table>
  <thead>
    <tr>
      <th>Número</th>
      <th>Status</th>
      <th>Qtd. Itens</th>
      <th>Ação</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let nota of notas">
      <td>{{ nota.numero }}</td>
      <td>{{ nota.status }}</td>
      <td>{{ nota.itens?.length }}</td>
      <td>
        <button
          *ngIf="nota.status === 'Aberta'"
          [disabled]="imprimindo === nota.numero"
          (click)="imprimir(nota.numero)">
          {{ imprimindo === nota.numero ? 'Imprimindo...' : 'Imprimir' }}
        </button>
      </td>
    </tr>
  </tbody>
</table>
